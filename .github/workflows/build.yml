name: build-and-push

on:
  schedule:
    # Run at 3:00 AM every Saturday
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set image name
        run: |
          echo "IMAGE_REPO=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build chunked image
        run: |
          set -euo pipefail

          sudo podman build \
            --network=host \
            -f Containerfile \
            -t "${IMAGE_REPO}-base:weekly" \
            .

          echo "Built base image: ${IMAGE_REPO}-base:weekly"

          export CHUNKAH_CONFIG_STR="$(
            sudo podman inspect "${IMAGE_REPO}-base:weekly"
          )"

          sudo podman run --rm \
            --mount=type=image,src="${IMAGE_REPO}-base:weekly",dest=/chunkah \
            -e CHUNKAH_CONFIG_STR \
            quay.io/coreos/chunkah build \
            --label ostree.bootable=1 \
            --compressed \
            --max-layers 256 | \
            sudo podman load | \
            sort -n | \
            head -n1 | \
            cut -d, -f2 | \
            cut -d: -f3 | \
            xargs -I{} sudo podman tag {} "${IMAGE_REPO}:weekly"

      - name: Push chunked image
        run: sudo podman push "${IMAGE_REPO}:weekly"

